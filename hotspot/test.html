<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>GridScan 自测</title>
<style>html,body{margin:0;height:100%;background:#050506}
#gs{position:fixed;inset:0}.gs-canvas{display:block;width:100%;height:100%}
#m{position:fixed;left:12px;bottom:10px;color:#9fd8ff;font:11px ui-monospace,Menlo,monospace}</style>
</head><body>
<div id="gs"></div><div id="m">载入中…</div>
<script src="./gridscan.js"></script>
<script>
  var m = document.getElementById('m');
  try {
    var inst = GridScan.init(document.getElementById('gs'), {
      sensitivity: 0.55, lineThickness: 1, linesColor: '#2F293A', gridScale: 0.1,
      scanColor: '#FF9FFC', scanOpacity: 0.4, bloomIntensity: 0.6,
      chromaticAberration: 0.002, noiseIntensity: 0.01, lineJitter: 0.1,
      scanGlow: 0.5, scanSoftness: 2, debugPulse: new URLSearchParams(location.search).has('dbg')
    });
    m.textContent = (inst && inst.ok)
      ? ('OK ' + (inst.gl.getParameter(inst.gl.VERSION) || ''))
      : ('FAIL ' + ((inst && inst.why) || '未知'));
  } catch (e) {
    m.textContent = 'THROW ' + (e && (e.stack || e.message) || String(e)).slice(0, 260);
  }
</script>
</body></html>
