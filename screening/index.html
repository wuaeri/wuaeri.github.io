<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>放映厅 · wuaeri</title>
<meta name="description" content="一份片单：黑色电影与希区柯克，十二部可直接在线看。挑片的标准是结构。">
<style>
/* ═══════════════════════════════════════════════════════════════
   放映厅
   ───────────────────────────────────────────────────────────────
   这一版的设计来自 ~/Projects/MusicLab/static/screening.html
   （2026-09-27 并站那一版）。嘉豪要的是「我们做的那个播放器前端」——
   就是那套：海报墙 + 自研全屏播放器 + 说明面板。

   搬过来时改的只有数据层：
     · 片库    /api/screening        →  library.json（静态站没有后端）
     · 片源    /screening/media/…    →  archive.org 直链
     · 海报    /screening/covers/…   →  covers/…
   播放器本身一个字没动：进度条、±15s、时间码、字幕轨、
   空格 / ←→ / c / Esc —— 全是那版原样。

   ⚠️ 那边那份文件原封不动留着（它跑在 127.0.0.1:8900，要后端）。
      两份不共享代码，是同一套设计的两个落点：那边给自己看（本地文件、
      下载状态、抽帧封面），这边给公开访客看（archive.org、在线播）。
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#08080a;                 /* 影院，比常规站底更黑一档 */
  --panel:#0d0d10; --line:#1b1b20; --line-2:#232329;
  --txt:#e9e9ec; --txt-2:#9a9aa5;
  --dim:#83838e;                /* 4.62:1 —— 读不清的灰不是风格，是缺陷 */
  --green:#8fd6b8;              /* 本区色：在库里那点光 */
  --warn:#b08f5e;
  --by-me:#9c8659;              /* 「嘉豪」那条署名 */
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:var(--line-2) var(--bg); scrollbar-width:thin}
body{
  background:var(--bg); color:var(--txt);
  font:15px/1.62 -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* 浏览器自己的东西也归设计管 */
::selection{background:rgba(143,214,184,.28); color:#fff}
::-webkit-scrollbar{width:12px; height:12px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:6px; border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a3a45}
:focus-visible{outline:2px solid var(--green); outline-offset:3px; border-radius:2px}
a{color:inherit; text-decoration:none}
a:hover{text-decoration:underline; text-underline-offset:3px}
kbd{
  font-family:var(--mono); font-size:11px; color:var(--txt-2);
  background:#17171c; padding:1px 5px; border-radius:3px; border:1px solid var(--line);
}

/* ── 顶栏 ─────────────────────────────────────────────────────── */
.top{
  display:flex; align-items:center; gap:14px;
  padding:9px 26px; min-height:54px;
  border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:40;
  background:rgba(8,8,10,.88);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
}
/* 品牌位。MusicLab 那边这儿是琥珀的 MUSICLAB —— 品牌色不动。
   到这儿品牌换成了 wuaeri，于是品牌色也换成站里的那道蓝。
   「牌子有颜色、其余中性」这条设计意图没变，变的只是哪个颜色是牌子。 */
.brand{
  font-family:var(--mono); font-size:13px; letter-spacing:.15em;
  color:#9fd8ff; font-weight:600;
}
.brand:hover{text-decoration:underline; text-underline-offset:3px}
.crumb{font-family:var(--mono); font-size:12px; color:var(--dim); letter-spacing:.14em}
.crumb::before{content:'/'; color:#33333d; margin-right:12px}
.top .spacer{flex:1}
.hosted{
  font-family:var(--mono); font-size:12px; color:var(--dim);
  display:flex; align-items:center; gap:7px; letter-spacing:.04em;
}
/* 静态的点，没有脉冲 —— 不变的事实不配脉冲 */
.pulse{width:6px; height:6px; border-radius:50%; background:var(--green)}

/* ── 墙 ───────────────────────────────────────────────────────── */
#wall{
  padding:46px 56px 120px;
  transition:opacity .58s cubic-bezier(.4,0,.2,1),
             transform .58s cubic-bezier(.4,0,.2,1),
             filter .58s ease;
}
#wall.out{opacity:0; transform:scale(.96); filter:blur(10px); pointer-events:none}

.head{display:flex; align-items:baseline; gap:16px; margin-bottom:46px; flex-wrap:wrap}
.head .note{font-size:12.5px; color:var(--dim); line-height:1.6}
/* 中文没有真斜体，浏览器给的是伪斜体 —— 用颜色分主次，不用倾斜 */
.head .note em{font-style:normal; color:var(--green)}
.head .n{font-family:var(--mono); font-size:12px; color:var(--dim); letter-spacing:.1em}
.head .tag{font-family:var(--mono); font-size:12px; color:var(--green); letter-spacing:.1em; margin-left:auto}

/* 分区 */
.sect{margin-bottom:64px}
.sect-head{display:flex; align-items:baseline; gap:12px; margin-bottom:26px}
.sect-head h2{font-size:11px; font-weight:500; letter-spacing:.24em; color:#86868f}
.sect-head .c{font-family:var(--mono); font-size:12px; color:var(--dim); letter-spacing:.12em}
.sect-head .line{flex:1; height:1px; background:var(--line)}
.sect-head .note{font-size:12px; color:var(--dim); letter-spacing:.02em}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(236px,1fr)); gap:42px 30px}

/* ★ 卡片抬起用 .28s —— .4s 是"场景转换"的长度，放在一次 hover 上会跟不上手。
   微反馈归微反馈，转场归转场。 */
.card{cursor:pointer; transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.card:hover{transform:translateY(-5px)}

/* ★ 框子 3/2。16:9 是"不放图"那个时代定的比例 ——
   13 张图实测比例 1.33～1.78、平均 1.45，3:2(1.5) 的裁切量最小。 */
.poster{
  position:relative; aspect-ratio:3/2; background:var(--panel);
  border-radius:3px; overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.045);
}

/* 版式块：大字年份 + 细线 + 时长。**兜底** ——
   图没到、图挂了、或者这部根本没封面时，你看到的是它。 */
.plate{
  position:absolute; inset:0; z-index:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px;
  background:#0d0d10;
}
.plate .yr{
  font-family:"Songti SC","STSong",Georgia,"Times New Roman",serif;
  font-size:50px; line-height:1; letter-spacing:.02em;
  color:#2b2b33; font-weight:400;
}
.plate .rule{width:26px; height:1px; background:#22222a}
.plate .meta{
  font-family:var(--mono); font-size:11px; letter-spacing:.2em; color:var(--dim);
  font-variant-numeric:tabular-nums;
}

/* ── 封面 ────────────────────────────────────────────────────────
   ★ 层级顺序不能乱：plate(0) → shot(1) → veil(2) → pmeta/badge(3) */
.shot{
  position:absolute; inset:0; z-index:1;
  width:100%; height:100%; object-fit:cover; object-position:center;
  opacity:0; transition:opacity .5s ease, transform .7s var(--ease-out);
}
.shot.in{opacity:1}
.card:hover .shot{transform:scale(1.035)}
.card.low-res .shot{image-rendering:auto}   /* 160×110 那三张，放大就放大吧 */
/* ★ 外站的图暗一档 —— 颜色本身在编码"能不能看"。
   ⚠️ 变暗**必须用 filter，不能用 opacity**：图是压在 .plate 版式块
   *上面*的，opacity 一降，下面那个「1931」大字就透出来了，
   两层内容叠在一起。filter 只改颜色、不产生透明，图还是实心的。 */
.card.away .shot{opacity:0; filter:saturate(.6) brightness(.62)}
.card.away .shot.in{opacity:1}

.veil{
  position:absolute; left:0; right:0; bottom:0; height:56%; z-index:2;
  background:linear-gradient(to bottom, rgba(6,6,8,0), rgba(6,6,8,.92));
  opacity:0; transition:opacity .5s ease; pointer-events:none;
}
.card.has-shot .veil{opacity:1}
/* 有了图之后，年份/时长落到画面左下角，不再居中占满 */
.pmeta{
  position:absolute; left:12px; bottom:11px; z-index:3;
  font-family:var(--mono); font-size:11px; letter-spacing:.12em;
  color:#d6d6dc; font-variant-numeric:tabular-nums;
  opacity:0; transform:translateY(4px); pointer-events:none;
  transition:opacity .45s ease, transform .45s var(--ease-out);
}
.card.has-shot .pmeta{opacity:1; transform:none}

.badge{
  position:absolute; left:9px; top:9px; z-index:3;
  font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:#c8c8cf;
  background:rgba(0,0,0,.62); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  padding:3px 7px; border-radius:3px;
}
.ext-arrow{
  position:absolute; right:9px; bottom:9px; z-index:3;
  font-size:11px; color:#c8c8cf;
  background:rgba(0,0,0,.55); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  width:22px; height:22px; display:grid; place-items:center; border-radius:3px;
}

/* ★ 「能看」用的是**一道有色的内描边**，不是彩色光晕。
   暗底上的彩色模糊光晕是 AI 生成 UI 的招牌动作 ——
   同样的信息，不借那个默认动作。
   对比也清楚了：能看的是一道绿边，不能看的是一道几乎看不见的白边。 */
.card.have .poster{box-shadow:inset 0 0 0 1px rgba(143,214,184,.34)}
.card.away .poster{box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
.card.away .title{color:#b9b9c0}

.title{margin-top:14px; font-size:14px; letter-spacing:.005em; color:#dcdce1}
.title em{font-style:normal; color:var(--dim); margin-left:7px; font-size:12.5px}
.sub{margin-top:5px; font-size:12px; color:var(--dim); line-height:1.5}
.by{margin-top:8px; font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--dim)}
.by.me{color:var(--by-me)}

/* ── 舞台 ─────────────────────────────────────────────────────── */
#stage{
  position:fixed; inset:0; background:#000; z-index:50;
  opacity:0; pointer-events:none;
  transition:opacity .68s cubic-bezier(.4,0,.2,1);
}
#stage.on{opacity:1; pointer-events:auto}
#stage video{width:100%; height:100%; object-fit:contain; display:block; background:#000}
#stage video::cue{
  background:rgba(0,0,0,.72); color:#fff;
  font:500 22px/1.5 -apple-system,"PingFang SC",sans-serif;
  text-shadow:0 1px 3px #000;
}
#ctrl{
  position:absolute; left:0; right:0; bottom:0; z-index:3;
  padding:80px 48px 34px;
  background:linear-gradient(transparent,rgba(0,0,0,.86));
  opacity:0; transform:translateY(12px);
  transition:opacity .38s ease, transform .38s ease;
}
#stage.ui #ctrl{opacity:1; transform:none}

.track{position:relative; height:14px; cursor:pointer; display:flex; align-items:center}
.track .rail{position:absolute; left:0; right:0; height:2.5px; background:rgba(255,255,255,.15); border-radius:3px}
.track .fill{position:absolute; left:0; height:2.5px; background:#e9e9ec; border-radius:3px; width:0}
.track .knob{
  position:absolute; width:9px; height:9px; margin-left:-4.5px; border-radius:50%;
  background:#fff; opacity:0; transition:opacity .22s; pointer-events:none;
}
#stage.ui .track .knob{opacity:1}

.row{
  display:flex; align-items:baseline; gap:16px; margin-top:14px;
  font-size:12px; color:#aeaeb7;
}
.row .now{color:#e2e2e7; letter-spacing:.02em}
.row .sp{flex:1}
.row .t{font-family:var(--mono); font-variant-numeric:tabular-nums; color:#9a9aa5; letter-spacing:.04em}
.row .btn{
  cursor:pointer; color:#9a9aa5; padding:2px 6px; border-radius:3px;
  transition:color 120ms ease-out, background 120ms ease-out; letter-spacing:.06em;
}
.row .btn:hover{color:#e2e2e7; background:rgba(255,255,255,.07)}
.row .btn:active{transform:scale(.96)}
.row .btn.off{color:var(--dim)}
.row .btn.on{color:var(--green)}

.back{
  position:absolute; left:48px; top:40px; z-index:3;
  font-family:var(--mono); font-size:12px; letter-spacing:.16em; color:#8d8d96;
  cursor:pointer; opacity:0; transition:opacity .38s ease, color 120ms ease-out;
}
.back:hover{color:#e9e9ec}
#stage.ui .back{opacity:1}

/* ── 面板 ─────────────────────────────────────────────────────── */
#panel{
  position:fixed; inset:0; z-index:60; display:grid; place-items:center;
  background:rgba(5,5,7,.84);
  -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px);
  opacity:0; pointer-events:none; transition:opacity .42s ease;
}
#panel.on{opacity:1; pointer-events:auto}
.panel{
  max-width:560px; padding:46px 48px 40px; margin:0 20px;
  background:#0c0c0f; border:1px solid var(--line); border-radius:4px;
  transform:translateY(10px); transition:transform .42s cubic-bezier(.2,.8,.2,1);
}
#panel.on .panel{transform:none}
.panel .k{font-family:var(--mono); font-size:11px; letter-spacing:.18em; color:var(--dim); margin-bottom:16px}
.panel h2{font-size:19px; font-weight:600; letter-spacing:.01em; margin-bottom:8px}
.panel .m{font-size:12.5px; color:var(--dim); margin-bottom:22px}
.panel p{font-size:13.5px; line-height:1.78; color:#a3a3ac; margin-bottom:26px; white-space:pre-wrap}
.panel .warn{
  font-size:12.5px; line-height:1.7; color:var(--warn);
  background:rgba(176,143,94,.07); border-left:2px solid rgba(176,143,94,.4);
  padding:12px 14px; margin-bottom:26px;
}
.panel .acts{display:flex; gap:14px; align-items:center; flex-wrap:wrap}
.panel a{
  font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-decoration:none;
  color:#0a0f0d; background:var(--green); padding:10px 20px; border-radius:3px;
  transition:background 140ms ease-out, transform 120ms ease-out;
}
.panel a:hover{background:#a9e3ca; text-decoration:none}
.panel a:active{transform:scale(.97); transition-duration:60ms}
.panel .cancel{font-size:12.5px; letter-spacing:.04em; color:var(--dim); cursor:pointer; padding:10px 4px}
.panel .cancel:hover{color:#c3c3cb}

.state{
  padding:16px; border:1px dashed var(--line-2); border-radius:3px;
  font-family:var(--mono); font-size:12px; color:var(--dim); line-height:1.7;
}

@media (max-width: 760px){
  #wall{padding:32px 22px 90px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:32px 18px}
  .top{padding:9px 18px}
  .hosted{display:none}
  #ctrl{padding:60px 20px 24px}
  .back{left:20px; top:24px}
  .panel{padding:34px 26px 30px}
}
@media (prefers-reduced-motion: reduce){
  #wall, #stage, .panel, .shot, .veil, .pmeta, .card{transition:none !important}
}
</style>
</head>
<body>

<div class="top">
  <a class="brand" href="../">wuaeri</a>
  <span class="crumb">放映厅</span>
  <span class="spacer"></span>
  <span class="hosted"><i class="pulse"></i>片子托管在 archive.org</span>
</div>

<div id="wall">
  <div class="head">
    <p class="note">
      点海报就进。选片只看一件事：<em>结构</em>。<br>
      片子都在 archive.org 上，不跳走，退场按 <kbd>Esc</kbd>。
    </p>
    <span class="n" id="count"></span>
    <span class="tag" id="tag"></span>
  </div>
  <div id="sects"></div>
</div>

<div id="stage">
  <div class="back" id="back">← 退场</div>
  <video id="video" playsinline></video>
  <div id="ctrl">
    <div class="track" id="track">
      <div class="rail"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div>
    </div>
    <div class="row">
      <span class="now" id="now"></span>
      <span class="sp"></span>
      <span class="btn" id="m15">−15</span>
      <span class="btn" id="p15">+15</span>
      <span class="t"><span id="tc">0:00</span> / <span id="td">0:00</span></span>
    </div>
  </div>
</div>

<div id="panel">
  <div class="panel">
    <div class="k" id="pK"></div>
    <h2 id="pT"></h2>
    <div class="m" id="pM"></div>
    <p id="pP"></p>
    <div class="warn" id="pW" style="display:none"></div>
    <div class="acts">
      <a id="pA" target="_blank" rel="noopener">去看</a>
      <span class="cancel" id="pX">留在这里</span>
    </div>
  </div>
</div>

<script>
'use strict';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let LIB = [], cur = null, uiTimer = null;

/* ── 片库 ──────────────────────────────────────────────────────── */
fetch('library.json', { cache: 'no-cache' }).then(r => {
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}).then(d => {
  if (!d.shelf || !d.shelf.length) throw new Error('片单是空的');
  LIB = d.shelf; render();
}).catch(e => {
  /* 不装作没事 —— 读不到就说读不到，并说清为什么 */
  $('#sects').innerHTML = '<div class="state">片单没读出来：' + esc(e.message) +
    '。如果这是用 file:// 直接打开的，换成 http 就正常了（在仓库根目录跑 python3 serve.py）。</div>';
});

function sect(title, note, items, group, dark){
  if (!items.length) return '';
  return '<div class="sect">' +
    '<div class="sect-head"><h2>' + title + '</h2>' +
      '<span class="c">' + items.length + '</span>' +
      '<span class="line"></span>' +
      '<span class="note">' + note + '</span></div>' +
    '<div class="grid" data-group="' + group + '" data-dark="' + (dark || 'away') + '">' +
      items.map(cardHTML).join('') +
    '</div></div>';
}

/* 两个区。MusicLab 那版是三个（在库里 / 片单上 / 在外站）——
   那个"文件还没下"的状态是给自己看的，公开站上它没有意义：
   访客只关心能不能看。 */
function render(){
  const have = LIB.filter(x => !!x.src);
  const away = LIB.filter(x => !x.src);
  const groups = { have, away };

  $('#count').textContent = LIB.length + ' 条';
  $('#tag').textContent = have.length + ' 部能直接看';
  $('#sects').innerHTML =
    sect('能看', '点开就放，不跳走', have, 'have', 'have') +
    sect('在外站', '本站放不了，点了看去哪儿看', away, 'away', 'away');

  document.querySelectorAll('.grid').forEach(g => {
    const list = groups[g.dataset.group] || [];
    const dark = g.dataset.dark;
    [...g.children].forEach((c, i) => {
      const item = list[i];
      if (!item) return;
      c.className = 'card ' + dark;
      c.onclick = () => open(item);
      wireShot(c.querySelector('.shot'));
    });
  });
}

function cardHTML(item){
  const canPlay = !!item.src;
  return '<div>' +
      '<div class="poster">' +
        /* 版式块永远先铺上（图挂了它就是你要看的东西），图盖在它上面 */
        '<div class="plate">' +
          '<span class="yr">' + esc(item.year || '—') + '</span>' +
          '<span class="rule"></span>' +
          '<span class="meta">' + esc(plateMeta(item)) + '</span>' +
        '</div>' +
        '<img class="shot" alt="" loading="lazy" decoding="async" src="' + esc(item.cover) + '">' +
        '<span class="veil"></span>' +
        '<span class="pmeta">' + esc(shotMeta(item)) + '</span>' +
        /* ★ 箭头只在**真有外链**的时候出现 ——
           ↗ 的意思就是"这里会离开本站"，那它就该看 url，不是看别的。 */
        (item.url ? '<span class="ext-arrow">↗</span>' : '') +
        '<span class="badge">' + esc(badgeOf(item)) + '</span>' +
      '</div>' +
      '<div class="title">' + esc(item.title) +
        (item.title_zh ? '<em>' + esc(item.title_zh) + '</em>' : '') + '</div>' +
      '<div class="sub">' + esc(item.subtitle || item.year || '') + '</div>' +
      '<div class="by' + (item.by === '嘉豪' ? ' me' : '') + '">' +
        (item.by === '嘉豪' ? '嘉豪' : '老C 推荐') +
      '</div>' +
    '</div>';
}

/* ── 封面：加载好就淡入，挂了就留版式块 ──────────────────────────
   （MusicLab 那版在这里还有一条"从本地片里抽帧"的支路。
     公开站没有本地片子可抽，那条删掉了 —— 没图就露版式块。） */
function wireShot(img){
  if (!img) return;
  const card = img.closest('.card');
  const giveUp = () => { img.remove(); };
  if (img.complete){
    if (img.naturalWidth) { img.classList.add('in'); card.classList.add('has-shot'); }
    else giveUp();
    return;
  }
  img.addEventListener('load', () => { img.classList.add('in'); card.classList.add('has-shot'); });
  img.addEventListener('error', giveUp);
}

function plateMeta(it){
  if (it.runtime_min) return it.runtime_min + ' 分';
  return it.url ? '外站' : '—';
}
/* 有图之后压在图上的那行 —— 年份 · 时长 */
function shotMeta(it){
  return [it.year, it.runtime_min ? it.runtime_min + ' 分' : null].filter(Boolean).join(' · ');
}
function badgeOf(it){
  if (it.src) return 'archive.org';
  if (it.url) return it.link_text ? it.link_text.replace(/^去\s*/, '') : '外站';
  return '—';
}

/* ── 打开 ──────────────────────────────────────────────────────── */
function open(item){
  if (!item.src) return openPanel(item);
  cur = item;
  $('#now').textContent = item.title + (item.title_zh ? ' · ' + item.title_zh : '');
  const v = $('#video');
  v.src = item.src;
  $('#wall').classList.add('out');
  setTimeout(() => {
    $('#stage').classList.add('on');
    v.play().catch(()=>{});
    flashUI();
  }, 340);
}

function close(){
  $('#stage').classList.remove('on','ui');
  const v = $('#video');
  setTimeout(() => { v.pause(); v.removeAttribute('src'); v.load(); cur = null; }, 620);
  $('#wall').classList.remove('out');
}

function flashUI(){
  $('#stage').classList.add('ui');
  clearTimeout(uiTimer);
  uiTimer = setTimeout(() => {
    $('#stage').classList.remove('ui');
  }, 3000);
}
document.addEventListener('mousemove', () => {
  if (!$('#stage').classList.contains('on')) return;
  flashUI();
});

const v = $('#video');
v.addEventListener('timeupdate', () => {
  if (!v.duration) return;
  const p = v.currentTime / v.duration;
  $('#fill').style.width = (p*100) + '%';
  $('#knob').style.left = (p*100) + '%';
  $('#tc').textContent = fmt(v.currentTime);
  $('#td').textContent = fmt(v.duration);
});
v.addEventListener('ended', close);
/* 片源在 archive.org，网断了/条目撤了会走这条 —— 得说话，不能黑着 */
v.addEventListener('error', () => {
  if (!v.getAttribute('src')) return;
  $('#now').textContent = '这段片子没取到（archive.org 那边的问题），换个网或者换一部试试';
});

function fmt(s){
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0');
}

$('#track').addEventListener('click', e => {
  const r = e.currentTarget.getBoundingClientRect();
  if (v.duration) v.currentTime = ((e.clientX - r.left) / r.width) * v.duration;
});
$('#m15').onclick = () => { v.currentTime -= 15; flashUI(); };
$('#p15').onclick = () => { v.currentTime += 15; flashUI(); };

document.addEventListener('keydown', e => {
  if ($('#panel').classList.contains('on')) { if (e.key === 'Escape') $('#panel').classList.remove('on'); return; }
  if (!$('#stage').classList.contains('on')) return;
  if (e.key === 'Escape') close();
  if (e.key === ' ') { e.preventDefault(); v.paused ? v.play() : v.pause(); flashUI(); }
  if (e.key === 'ArrowLeft')  { v.currentTime -= 15; flashUI(); }
  if (e.key === 'ArrowRight') { v.currentTime += 15; flashUI(); }
});
$('#back').onclick = close;
$('#stage').addEventListener('click', e => {
  if (e.target.id === 'video') v.paused ? v.play() : v.pause();
});

/* ── 面板（外站的说明）────────────────────────────────────────── */
function openPanel(item){
  $('#pK').textContent = item.link_text ? item.link_text.replace(/^去\s*/, '') : '外站';
  $('#pT').textContent = item.title + (item.title_zh ? ' · ' + item.title_zh : '');
  $('#pM').textContent = [item.subtitle, item.year].filter(Boolean).join(' · ');
  $('#pP').textContent = item.why || '';
  const w = $('#pW');
  if (item.warn) { w.textContent = item.warn; w.style.display = ''; }
  else w.style.display = 'none';
  const a = $('#pA');
  if (item.url) { a.href = item.url; a.style.display = ''; a.textContent = item.link_text || '去看'; }
  else a.style.display = 'none';
  $('#panel').classList.add('on');
}
$('#pX').onclick = () => $('#panel').classList.remove('on');
$('#panel').addEventListener('click', e => { if (e.target.id === 'panel') $('#panel').classList.remove('on'); });
</script>
</body>
</html>
